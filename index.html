<!doctype html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Projecte Solidari SMX · 2026</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --ink: #17233b;
            --muted: #64748b;
            --primary: #3756d9;
            --border: #dfe5ef;
            --white: #fff;
            --accent: #e8edff
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
            line-height: 1.55
        }

        header {
            background: #17264c;
            color: white;
            padding: 18px max(22px, calc((100vw - 1160px)/2));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap
        }

        .brand {
            font-weight: 850;
            letter-spacing: .03em
        }

        .subbrand {
            color: #c8d5ff;
            font-size: .83rem
        }

        nav {
            display: flex;
            gap: 7px;
            flex-wrap: wrap
        }

        nav button {
            background: transparent;
            border: 1px solid #63749b;
            color: white;
            border-radius: 9px;
            padding: 8px 11px;
            cursor: pointer;
            font-weight: 650
        }

        nav button.active,
        nav button:hover {
            background: #fff;
            color: #17264c
        }

        main {
            max-width: 1160px;
            margin: auto;
            padding: 32px 22px 80px
        }

        .page {
            display: none
        }

        .page.active {
            display: block
        }

        .eyebrow {
            color: var(--primary);
            font-size: .85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .1em
        }

        h1 {
            font-size: clamp(2.1rem, 5vw, 3.6rem);
            line-height: 1.1;
            letter-spacing: -.04em;
            margin: 12px 0 16px
        }

        h2 {
            font-size: 1.65rem;
            letter-spacing: -.025em;
            margin: 0 0 12px
        }

        h3 {
            margin: 0 0 9px;
            font-size: 1.08rem
        }

        .lead {
            font-size: 1.15rem;
            color: #465673;
            max-width: 850px
        }

        .hero {
            background: linear-gradient(125deg, #e7edff, #fff 65%);
            border: 1px solid #d9e1fc;
            border-radius: 24px;
            padding: clamp(24px, 5vw, 54px);
            margin-bottom: 28px
        }

        .pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px
        }

        .pill {
            border: 1px solid #c8d5f4;
            background: white;
            padding: 9px 13px;
            border-radius: 100px;
            font-weight: 700;
            font-size: .9rem
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px
        }

        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 5px 24px #20345b08
        }

        .date {
            color: var(--primary);
            font-weight: 850;
            font-size: .88rem
        }

        .big {
            font-size: 1.5rem;
            font-weight: 850;
            letter-spacing: -.03em;
            margin: 5px 0
        }

        .small {
            color: var(--muted);
            font-size: .91rem
        }

        .section {
            margin-top: 34px
        }

        .strip {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0
        }

        .tag {
            background: #e8edff;
            color: #314bc2;
            border-radius: 7px;
            padding: 6px 10px;
            font-weight: 750;
            font-size: .84rem
        }

        .tag.gray {
            background: #eef1f5;
            color: #4c5c75
        }

        .tag.green {
            background: #e5f6eb;
            color: #14633c
        }

        .day {
            display: grid;
            grid-template-columns: 170px 1fr;
            gap: 20px;
            border-top: 1px solid var(--border);
            padding: 22px 0
        }

        .day:last-child {
            border-bottom: 1px solid var(--border)
        }

        .dayhead {
            font-weight: 850
        }

        .hours {
            display: inline-block;
            margin-top: 6px;
            color: #65748a;
            font-weight: 650;
            font-size: .9rem
        }

        .tasks {
            margin: 10px 0 0;
            padding-left: 22px
        }

        .tasks li {
            margin: 5px 0
        }

        .deliver {
            background: #eef2ff;
            border: 1px solid #cad5ff;
            border-radius: 18px;
            padding: 25px;
            margin-top: 28px
        }

        .deliver h2 {
            color: #273ea6
        }

        .cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        .note {
            background: white;
            border: 1px solid var(--border);
            border-left: 4px solid #5a70e7;
            border-radius: 12px;
            padding: 18px
        }

        .checklist {
            list-style: none;
            padding: 0;
            margin: 8px 0
        }

        .checklist li {
            padding: 8px 0;
            border-bottom: 1px solid #e6eaf2
        }

        .checklist li:before {
            content: '☐';
            margin-right: 10px;
            color: #5369d9;
            font-size: 1.2rem
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 32px
        }

        button.action {
            background: var(--primary);
            border: 0;
            border-radius: 10px;
            color: white;
            padding: 12px 18px;
            font-weight: 800;
            cursor: pointer
        }

        button.action.secondary {
            background: #e8edfa;
            color: #273b80
        }

        button.action:disabled {
            opacity: .3;
            cursor: default
        }

        footer {
            border-top: 1px solid var(--border);
            color: var(--muted);
            padding: 24px;
            text-align: center;
            font-size: .85rem
        }

        .timeline {
            display: grid;
            gap: 10px
        }

        .row {
            display: grid;
            grid-template-columns: 135px 1fr;
            gap: 14px;
            align-items: start;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px
        }

        .row strong {
            color: #304dc2
        }

        .progress {
            height: 6px;
            background: #dfe6f5
        }

        .progress>div {
            height: 100%;
            background: #5271e8;
            transition: width .2s
        }

        .hint {
            font-size: .9rem;
            color: #586987
        }

        a {
            color: #304dc2
        }

        @media(max-width:760px) {

            .grid,
            .cols {
                grid-template-columns: 1fr
            }

            .day {
                grid-template-columns: 1fr;
                gap: 4px
            }

            .row {
                grid-template-columns: 100px 1fr
            }

            nav button {
                font-size: .8rem;
                padding: 7px
            }

            header {
                padding: 18px 20px
            }
        }

        @media print {

            header nav,
            .actions,
            .progress {
                display: none !important
            }

            main {
                padding: 0
            }

            .page {
                display: block !important;
                break-before: page
            }

            .hero {
                padding: 25px
            }

            .card,
            .day,
            .deliver {
                break-inside: avoid
            }

            body {
                background: white
            }
        }

        .gantt-scroll {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: white
        }

        .gantt {
            display: block;
            width: 100%;
            min-width: 900px;
            height: auto;
            font-family: inherit;
            fill: var(--ink)
        }

        .gantt-scroll:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px
        }

        .gantt-mobile-hint {
            display: none
        }

        @media(max-width:940px) {
            .gantt-mobile-hint {
                display: block
            }
        }

        @media print {
            .gantt {
                min-width: 0
            }

            .gantt-scroll {
                overflow: visible
            }

            .gantt-mobile-hint {
                display: none
            }
        }
    </style>

            const ticks = sessions.filter((d, i) => i === 0 || Math.floor((d - start) / (7 * dayMs)) !== Math.floor((sessions[i - 1] - start) / (7 * dayMs)));
            const milestones = ['Validació inicial', 'Entrega 1 · Planificació', 'Entrega 2 · Prototip', 'Entrega 3 · MVP complet', 'Entrega 4 · Producte final', 'Jornada Solidària'];
            return `<section class="section"><h2>Calendari del projecte · diagrama de Gantt</h2><p class="hint">Del 19 d’octubre al 18 de desembre de 2026. Escala de sessions lectives: s’ometen els dies sense classe. Les fases s’enllacen de manera contínua i els rombes indiquen la data real de cada fita.</p><div class="gantt-scroll" tabindex="0" role="region" aria-label="Calendari del projecte amb desplaçament horitzontal"><svg class="gantt" viewBox="0 0 1120 580" role="img" aria-labelledby="gantt-title gantt-desc"><title id="gantt-title">Blocs i fites del projecte solidari</title><desc id="gantt-desc">${blocks.map((b, i) => `Bloc ${i + 1}: ${b.title}, ${b.dates}. ${b.due}.`).join(' ')}</desc><rect width="1120" height="580" rx="16" fill="white"/><text x="22" y="30" font-size="14" font-weight="700">BLOC / FASE</text><text x="250" y="30" font-size="14" font-weight="700">OCTUBRE</text><text x="${x(Date.UTC(2026, 10, 1))}" y="30" font-size="14" font-weight="700">NOVEMBRE</text><text x="${x(Date.UTC(2026, 11, 1))}" y="30" font-size="14" font-weight="700">DESEMBRE</text>${ticks.map(d => `<line x1="${x(d)}" y1="65" x2="${x(d)}" y2="550" stroke="#e2e8f0"/><text x="${x(d)}" y="55" text-anchor="middle" font-size="12" fill="#64748b">${new Date(d).getUTCDate()}/${new Date(d).getUTCMonth() + 1}</text>`).join('')}<line x1="1060" y1="65" x2="1060" y2="550" stroke="#14633c" stroke-dasharray="5 4"/><text x="1060" y="55" text-anchor="middle" font-size="12" fill="#14633c">18/12</text>${blocks.map((b, i) => { const first = dateOf(b.days[0][0]), last = dateOf(b.days[b.days.length - 1][0]), y = 90 + i * 77, left = x(first), right = x(last), barEnd = i < blocks.length - 1 ? x(dateOf(blocks[i + 1].days[0][0])) : right, color = i === 5 ? '#218354' : '#3756d9'; return `<g><text x="22" y="${y + 9}" font-size="15" font-weight="700">${i + 1} · ${['Idear', 'Planificar', 'Dissenyar', 'Construir', 'Validar', 'Presentar'][i]}</text><text x="22" y="${y + 30}" font-size="12" fill="#64748b">${b.dates}</text><rect x="${left}" y="${y - 8}" width="${Math.max(6, barEnd - left)}" height="24" rx="6" fill="${color}" opacity=".85"/>${i < blocks.length - 1 ? `<path d="M ${barEnd} ${y + 16} V ${y + 69}" fill="none" stroke="#a9b8eb" stroke-width="2" stroke-dasharray="4 3"/>` : ''}<path d="M ${right} ${y - 4} l 9 12 l -9 12 l -9 -12 Z" fill="${color}" stroke="white" stroke-width="2"/><text x="${right}" y="${y + 41}" text-anchor="end" font-size="12" font-weight="650" fill="${color}">${b.days[b.days.length - 1][0].split(' ')[1]} · ${milestones[i]}</text></g>`; }).join('')}</svg></div><p class="hint gantt-mobile-hint">En pantalles petites, desplaça el diagrama horitzontalment per veure tot el calendari.</p></section>`;
        }
        const nav = document.getElementById('nav'), main = document.getElementById('main');
        nav.innerHTML = ['Portada', ...blocks.map((b, i) => `${i + 1} · ${b.short}`)].map((s, i) => `<button data-page="${i}">${s}</button>`).join('');
        const home = `<section class="page" id="page0"><div class="hero"><div class="eyebrow">SMX · Curs 2026 · Projecte tecnològic solidari</div><h1>Del problema<br>al prototip.</h1><p class="lead">Dissenya una solució tecnològica amb finalitat solidària. Organitza la feina amb Trello, demostra avenços cada setmana i prepara una activitat perquè els companys hi participin el <strong>18 de desembre de 2026</strong>.</p><div class="pills"><span class="pill">Inici · 19/10/2026</span><span class="pill">♥ Jornada · 18/12</span><span class="pill">✓ Producte acabat · 10/12</span><span class="pill">◷ 6 h setmanals</span><span class="pill">▦ 4 entregues obligatòries</span></div></div><h2>Dates clau d'entrega</h2><div class="grid">${keyDates.map(([d, t, s], i) => `<div class="card"><div class="date">${d} · 2026</div><div class="big">${t}</div><div class="small">${s}</div>${i < blocks.length ? `<p><a href="#bloc-${i + 2}" data-go="${i + 2}">Veure el bloc →</a></p>` : ''}</div>`).join('')}</div>${renderGantt()}<section class="section cols"><div class="note"><h3>Com treballarem?</h3><p><strong>Dilluns · 3 h:</strong> producció i desenvolupament.<br><strong>Dimarts · 1 h:</strong> revisió de Trello, bloquejos i decisions.<br><strong>Dijous · 2 h:</strong> tancament de tasques i entrega.</p></div><div class="note"><h3>Regla d'or</h3><p><strong>Una tasca no està feta sense evidència.</strong> Cada targeta del Trello ha de tenir responsable, data límit, criteri d'acceptació i prova del resultat. Prioritza l’MVP abans de les millores opcionals.</p></div></section><div class="actions"><span></span><button class="action" data-next="1">Començar · Bloc 1 →</button></div></section>`;
        function renderBlock(b, i) { return `<section class="page" id="page${i + 1}"><div class="eyebrow">Bloc ${i + 1} · ${blocks.length} blocs · ${b.dates}</div><h1>${b.title}</h1><p class="lead">${b.goal}</p><div class="strip"><span class="tag">Trello + evidències</span><span class="tag gray">${b.dates}</span><span class="tag green">${i === 0 ? 'Validació' : 'Entrega'}: ${b.due.split(' · ')[0]}</span></div>${i === 0 ? `<section class="deliver"><h2>Documentació guiada · pas a pas</h2><p>Feu servir un únic dossier compartit i completeu-lo a cada sessió. La guia inclou una fitxa de funcionalitat resolta, arquitectura amb caixes i fletxes i wireframes que podeu dibuixar a mà.</p><p><a href="guia_idear.html">Obrir la guia i la plantilla →</a> · <a href="plantilla_idear.md" download>Descarregar la plantilla per copiar-la al vostre document</a></p><p class="hint">Al final de cada sessió: actualitzeu el dossier, afegiu les evidències i dediqueu cinc minuts al diari i al Trello. Aquests esbossos inicials es desenvoluparan al bloc 3.</p></section>` : ''}<section class="section"><h2>Què hem de fer cada dia?</h2>${b.days.map(([day, h, tasks, evidence]) => `<div class="day"><div><div class="dayhead">${day}</div><span class="hours">${h}</span></div><div><h3>Tasques de la sessió</h3><ul class="tasks">${tasks.map(t => `<li>${t}</li>`).join('')}</ul><p class="small"><strong>Evidència del dia:</strong> ${evidence}</p></div></div>`).join('')}</section><section class="deliver"><div class="eyebrow">${i === 0 ? 'Validació inicial' : 'Control obligatori'}</div><h2>${b.due}</h2><p><strong>Què heu de presentar?</strong> ${b.product}.</p><div class="cols"><div class="card"><h3>Checklist per superar l'entrega</h3><ul class="checklist">${b.criteria.map(c => `<li>${c}</li>`).join('')}</ul></div><div class="card"><h3>Què ha de quedar al Trello?</h3><p>${b.trello}</p><h3>Com es valida?</h3><p>Demostració breu davant del professorat i revisió d'evidències. Estat: <strong>🟢 assolit · 🟠 en risc · 🔴 no assolit</strong>.</p></div></div></section><div class="actions"><button class="action secondary" data-prev="${i}">← ${i === 0 ? 'Portada' : 'Bloc anterior'}</button>${i < blocks.length - 1 ? `<button class="action" data-next="${i + 2}">Bloc següent →</button>` : `<button class="action" data-next="0">Tornar a la portada ↗</button>`}</div></section>` }
        main.innerHTML = home + blocks.map(renderBlock).join('');
        function show(i) { document.querySelectorAll('.page').forEach((p, j) => p.classList.toggle('active', j === i)); document.querySelectorAll('nav button').forEach((b, j) => b.classList.toggle('active', j === i)); document.getElementById('progressBar').style.width = `${(i + 1) / (blocks.length + 1) * 100}%`; history.replaceState(null, '', i ? '#bloc-' + i : '#portada'); window.scrollTo({ top: 0, behavior: 'instant' }); } document.addEventListener('click', e => { let b = e.target.closest('[data-page],[data-next],[data-prev],[data-go]'); if (!b) return; e.preventDefault(); show(Number(b.dataset.page ?? b.dataset.next ?? b.dataset.prev ?? b.dataset.go)) }); let hash = location.hash.match(/bloc-(\d+)/); show(hash ? Math.max(1, Math.min(blocks.length, Number(hash[1]))) : 0);
    </script>
</body>
