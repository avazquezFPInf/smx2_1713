<!doctype html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Projecte Solidari SMX · 2026</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --ink: #17233b;
            --muted: #64748b;
            --primary: #3756d9;
            --border: #dfe5ef;
            --white: #fff;
            --accent: #e8edff
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
            line-height: 1.55
        }

        header {
            background: #17264c;
            color: white;
            padding: 18px max(22px, calc((100vw - 1160px)/2));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap
        }

        .brand {
            font-weight: 850;
            letter-spacing: .03em
        }

        .subbrand {
            color: #c8d5ff;
            font-size: .83rem
        }

        nav {
            display: flex;
            gap: 7px;
            flex-wrap: wrap
        }

        nav button {
            background: transparent;
            border: 1px solid #63749b;
            color: white;
            border-radius: 9px;
            padding: 8px 11px;
            cursor: pointer;
            font-weight: 650
        }

        nav button.active,
        nav button:hover {
            background: #fff;
            color: #17264c
        }

        main {
            max-width: 1160px;
            margin: auto;
            padding: 32px 22px 80px
        }

        .page {
            display: none
        }

        .page.active {
            display: block
        }

        .eyebrow {
            color: var(--primary);
            font-size: .85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .1em
        }

        h1 {
            font-size: clamp(2.1rem, 5vw, 3.6rem);
            line-height: 1.1;
            letter-spacing: -.04em;
            margin: 12px 0 16px
        }

        h2 {
            font-size: 1.65rem;
            letter-spacing: -.025em;
            margin: 0 0 12px
        }

        h3 {
            margin: 0 0 9px;
            font-size: 1.08rem
        }

        .lead {
            font-size: 1.15rem;
            color: #465673;
            max-width: 850px
        }

        .hero {
            background: linear-gradient(125deg, #e7edff, #fff 65%);
            border: 1px solid #d9e1fc;
            border-radius: 24px;
            padding: clamp(24px, 5vw, 54px);
            margin-bottom: 28px
        }

        .pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px
        }

        .pill {
            border: 1px solid #c8d5f4;
            background: white;
            padding: 9px 13px;
            border-radius: 100px;
            font-weight: 700;
            font-size: .9rem
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px
        }

        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 5px 24px #20345b08
        }

        .date {
            color: var(--primary);
            font-weight: 850;
            font-size: .88rem
        }

        .big {
            font-size: 1.5rem;
            font-weight: 850;
            letter-spacing: -.03em;
            margin: 5px 0
        }

        .small {
            color: var(--muted);
            font-size: .91rem
        }

        .section {
            margin-top: 34px
        }

        .strip {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0
        }

        .tag {
            background: #e8edff;
            color: #314bc2;
            border-radius: 7px;
            padding: 6px 10px;
            font-weight: 750;
            font-size: .84rem
        }

        .tag.gray {
            background: #eef1f5;
            color: #4c5c75
        }

        .tag.green {
            background: #e5f6eb;
            color: #14633c
        }

        .day {
            display: grid;
            grid-template-columns: 170px 1fr;
            gap: 20px;
            border-top: 1px solid var(--border);
            padding: 22px 0
        }

        .day:last-child {
            border-bottom: 1px solid var(--border)
        }

        .dayhead {
            font-weight: 850
        }

        .hours {
            display: inline-block;
            margin-top: 6px;
            color: #65748a;
            font-weight: 650;
            font-size: .9rem
        }

        .tasks {
            margin: 10px 0 0;
            padding-left: 22px
        }

        .tasks li {
            margin: 5px 0
        }

        .deliver {
            background: #eef2ff;
            border: 1px solid #cad5ff;
            border-radius: 18px;
            padding: 25px;
            margin-top: 28px
        }

        .deliver h2 {
            color: #273ea6
        }

        .cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        .note {
            background: white;
            border: 1px solid var(--border);
            border-left: 4px solid #5a70e7;
            border-radius: 12px;
            padding: 18px
        }

        .checklist {
            list-style: none;
            padding: 0;
            margin: 8px 0
        }

        .checklist li {
            padding: 8px 0;
            border-bottom: 1px solid #e6eaf2
        }

        .checklist li:before {
            content: '☐';
            margin-right: 10px;
            color: #5369d9;
            font-size: 1.2rem
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 32px
        }

        button.action {
            background: var(--primary);
            border: 0;
            border-radius: 10px;
            color: white;
            padding: 12px 18px;
            font-weight: 800;
            cursor: pointer
        }

        button.action.secondary {
            background: #e8edfa;
            color: #273b80
        }

        button.action:disabled {
            opacity: .3;
            cursor: default
        }

        footer {
            border-top: 1px solid var(--border);
            color: var(--muted);
            padding: 24px;
            text-align: center;
            font-size: .85rem
        }

        .timeline {
            display: grid;
            gap: 10px
        }

        .row {
            display: grid;
            grid-template-columns: 135px 1fr;
            gap: 14px;
            align-items: start;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px
        }

        .row strong {
            color: #304dc2
        }

        .progress {
            height: 6px;
            background: #dfe6f5
        }

        .progress>div {
            height: 100%;
            background: #5271e8;
            transition: width .2s
        }

        .hint {
            font-size: .9rem;
            color: #586987
        }

        a {
            color: #304dc2
        }

        @media(max-width:760px) {

            .grid,
            .cols {
                grid-template-columns: 1fr
            }

            .day {
                grid-template-columns: 1fr;
                gap: 4px
            }

            .row {
                grid-template-columns: 100px 1fr
            }

            nav button {
                font-size: .8rem;
                padding: 7px
            }

            header {
                padding: 18px 20px
            }
        }

        @media print {

            header nav,
            .actions,
            .progress {
                display: none !important
            }

            main {
                padding: 0
            }

            .page {
                display: block !important;
                break-before: page
            }

            .hero {
                padding: 25px
            }

            .card,
            .day,
            .deliver {
                break-inside: avoid
            }

            body {
                background: white
            }
        }

        .gantt-scroll {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: white
        }

        .gantt {
            display: block;
            width: 100%;
            min-width: 900px;
            height: auto;
            font-family: inherit;
            fill: var(--ink)
        }

        .gantt-scroll:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px
        }

        .gantt-mobile-hint {
            display: none
        }

        @media(max-width:940px) {
            .gantt-mobile-hint {
                display: block
            }
        }

        @media print {
            .gantt {
                min-width: 0
            }

            .gantt-scroll {
                overflow: visible
            }

            .gantt-mobile-hint {
                display: none
            }
        }
    .phase-card{border-top:5px solid var(--phase)}.phase-card .date{color:var(--phase)}.template-link{display:inline-block;background:#e8edff;border:1px solid #c8d5f4;border-radius:10px;padding:12px 15px;font-weight:750}.milestone-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.milestone-cards a{text-decoration:none;color:var(--ink)}.phase-gantt{overflow:auto;border:1px solid var(--border);border-radius:16px;background:white}.gantt-inner{min-width:1000px;padding:18px 20px 24px}.gantt-row{display:grid;grid-template-columns:330px 1fr;gap:20px;min-height:58px;align-items:center}.gantt-label{font-size:.86rem;padding:8px 0;line-height:1.35}.gantt-label strong{display:block}.gantt-label span{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}.gantt-track{position:relative;height:100%;min-height:45px;background:repeating-linear-gradient(to right,transparent 0,transparent calc(12.069% - 1px),#edf0f5 calc(12.069% - 1px),#edf0f5 12.069%)}.gantt-bar{position:absolute;top:50%;transform:translateY(-50%);height:18px;background:var(--phase);opacity:.65;border-radius:5px}.phase-duration .gantt-bar{height:26px;opacity:1}.phase-duration .gantt-label{color:var(--phase)}.gantt-axis{min-height:40px;border-bottom:1px solid var(--border);margin-bottom:8px;font-weight:700}.gantt-axis .gantt-track{background:none}.gantt-axis .gantt-track span{position:absolute;top:10px;transform:translateX(-50%);font-size:.75rem;color:var(--muted);white-space:nowrap}.gantt-phase{margin:10px 0;border-bottom:1px solid var(--border);padding-bottom:8px}.gantt-phase summary{cursor:pointer;padding:12px;background:#f5f7fb;border-radius:8px;font-weight:800;color:var(--phase)}.gantt-phase summary .small{margin-left:14px;font-weight:500}.gantt-diamond{position:absolute;top:50%;transform:translate(-50%,-50%);color:var(--phase);font-size:24px;line-height:1}.milestone-row{background:#f8fafc}.phase-gantt:focus-visible,summary:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #3756d9;outline-offset:3px}@media(max-width:760px){.milestone-cards{grid-template-columns:1fr 1fr}.template-link{width:100%}}@media print{.gantt-inner{min-width:0;padding:6px}.gantt-row{grid-template-columns:230px 1fr;gap:10px}.gantt-label{font-size:9pt}.gantt-axis .gantt-track span{font-size:7pt}.phase-gantt{overflow:visible}details{break-inside:avoid}}

</style>
</head>

<body>
    <header>
        <div>
            <div class="brand">♥ PROJECTE SOLIDARI · SMX 2026</div>
            <div class="subbrand">22 d’octubre – 18 de desembre de 2026 · Jornada Solidària</div>
        </div>
        <nav id="nav"></nav>
    </header>
    <div class="progress">
        <div id="progressBar"></div>
    </div>
    <main id="main"></main>
    <footer>Guia de treball i seguiment · Trello és l'eina de gestió del projecte · Calendari 2026</footer>
    <script>
const phases = [
 {title:'Definim el nostre projecte',short:'Definir',dates:'22 d’octubre – 6 de novembre',start:'2026-10-22',end:'2026-11-06',color:'#3756d9',goal:'De la idea a una proposta concreta i viable.',activities:[['Identificació del problema i proposta','2026-10-22','2026-10-30'],['Objectius, usuaris, funcionalitats i MVP','2026-11-02','2026-11-06']],topics:['Identificació del problema i proposta de solució.','Objectius del projecte i identificació de les persones usuàries.','Funcionalitats principals i priorització del producte mínim viable (MVP).'],product:'Document de definició del projecte amb l’MVP validat pel professorat.',due:'6 de novembre',template:'https://docs.google.com/document/d/1OmhdaRfofRwSAoE6BLJ_P5oTSKnuE1X6nSeW7Wb4_d4/edit?usp=sharing'},
 {title:'Dissenyem i planifiquem la solució',short:'Dissenyar i planificar',dates:'9–20 de novembre',start:'2026-11-09',end:'2026-11-20',color:'#8a43b6',goal:'Del projecte definit al pla de desenvolupament.',activities:[['Disseny de pantalles, dades i tecnologies','2026-11-09','2026-11-13'],['IA, Kanban, planificació i primer prototip','2026-11-16','2026-11-20']],topics:['Disseny de pantalles i components i identificació de les dades necessàries.','Selecció de tecnologies i eines i definició d’instruccions per desenvolupar amb IA.','Descomposició en tasques, organització del tauler Kanban i planificació dels sprints.','Inici del primer prototip.'],product:'Disseny de la solució, Kanban organitzat i primer prototip.',due:'20 de novembre',template:null},
 {title:'Construïm, provem i presentem',short:'Construir i presentar',dates:'23 de novembre – 18 de desembre',start:'2026-11-23',end:'2026-12-18',color:'#187b55',goal:'De la planificació a un producte demostrable.',activities:[['Desenvolupament de funcionalitats principals','2026-11-23','2026-11-27'],['Completar l’MVP','2026-11-30','2026-12-04'],['Proves, correccions i publicació','2026-12-07','2026-12-11'],['Documentació, assaig i presentació','2026-12-14','2026-12-17'],['Jornada Solidària','2026-12-18','2026-12-18']],topics:['Desenvolupament de les funcionalitats imprescindibles i integració de l’MVP.','Proves funcionals, correcció d’errors i millores d’usabilitat.','Publicació o preparació de la demostració.','Documentació final, assaig i presentació del projecte.'],product:'MVP funcional o prototip validat i presentació final.',due:'18 de desembre',template:null}
];
const milestones=[['2026-11-06','MVP definit i aprovat',1],['2026-11-20','Primer prototip',2],['2026-12-04','MVP funcional',3],['2026-12-18','Jornada Solidària',3]];
const dayMs=86400000,origin=Date.parse('2026-10-22'),totalDays=58;
const offset=d=>(Date.parse(d)-origin)/dayMs;
const dateLabel=d=>new Intl.DateTimeFormat('ca',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(d));
const shortDate=d=>`${Number(d.slice(8))}/${Number(d.slice(5,7))}`;
function templateLink(p,i){return p.template?`<a class="template-link" href="${p.template}" target="_blank" rel="noopener">Plantilla Fase ${i+1} — Definició del projecte ↗</a>`:i===1?'<p class="small">Plantilla de la fase 2: pendent d’incorporar.</p>':'';}
function barRow(label,start,end,color,kind='activity'){
 const left=offset(start)/totalDays*100,width=(offset(end)-offset(start)+1)/totalDays*100;
 return `<div class="gantt-row ${kind}" style="--phase:${color}"><div class="gantt-label"><strong>${label}</strong><span>${shortDate(start)}${start!==end?' – '+shortDate(end):''}</span></div><div class="gantt-track"><span class="gantt-bar" style="left:${left}%;width:${width}%" aria-hidden="true"></span></div></div>`;
}
function gantt(){return `<section class="section" aria-labelledby="gantt-heading"><h2 id="gantt-heading">Cronograma del projecte</h2><p class="hint">Barres: durada prevista · ◆: fita. Desplegueu cada fase per consultar-ne les activitats.</p><div class="phase-gantt" role="region" aria-label="Gantt del 22 d’octubre al 18 de desembre de 2026" tabindex="0"><div class="gantt-inner"><div class="gantt-row gantt-axis"><div class="gantt-label">OCTUBRE → DESEMBRE · 2026</div><div class="gantt-track">${['2026-10-22','2026-11-02','2026-11-09','2026-11-16','2026-11-23','2026-11-30','2026-12-07','2026-12-18'].map(d=>`<span style="left:${(offset(d)+.5)/totalDays*100}%">${shortDate(d)}</span>`).join('')}</div></div>${phases.map((p,i)=>`<details class="gantt-phase" open style="--phase:${p.color}"><summary><span>Fase ${i+1} · ${p.short}</span><span class="small">${p.dates}</span></summary>${barRow(p.title,p.start,p.end,p.color,'phase-duration')}${p.activities.map(([label,start,end])=>start===end?milestoneRow(label,start,p.color):barRow(label,start,end,p.color)).join('')}${milestones.filter(([,label,n])=>n===i+1&&label!=='Jornada Solidària').map(([d,label])=>milestoneRow(label,d,p.color)).join('')}</details>`).join('')}</div></div><p class="hint">Calendari orientatiu: es pot ajustar segons el ritme de treball i les hores lectives disponibles. Les franges indiquen períodes de treball, no sessions de classe cada dia.</p></section>`;}
function milestoneRow(label,date,color){return `<div class="gantt-row milestone-row" style="--phase:${color}"><div class="gantt-label"><strong>◆ ${label}</strong><span>${dateLabel(date)}</span></div><div class="gantt-track"><span class="gantt-diamond" style="left:${(offset(date)+.5)/totalDays*100}%" aria-hidden="true">◆</span></div></div>`;}
const nav=document.getElementById('nav'),main=document.getElementById('main');
nav.innerHTML=['Portada',...phases.map((p,i)=>`Fase ${i+1} · ${p.short}`)].map((label,i)=>`<button data-page="${i}">${label}</button>`).join('');
const home=`<section class="page" id="page0"><div class="hero"><div class="eyebrow">SMX · Projecte tecnològic solidari · 2026</div><h1>De la idea<br>a la Jornada Solidària.</h1><p class="lead">Definim una proposta útil, dissenyem la solució i construïm un producte demostrable per a la Jornada del <strong>18 de desembre</strong>.</p><div class="pills"><span class="pill">22/10 – 18/12 · 2026</span><span class="pill">3 fases de treball</span><span class="pill">Trello · tasques i evidències</span></div></div><h2>Les tres fases del projecte</h2><div class="grid">${phases.map((p,i)=>`<article class="card phase-card" style="--phase:${p.color}"><div class="date">FASE ${i+1} · ${p.dates}</div><h3>${p.title}</h3><p>${p.goal}</p><p class="small"><strong>Lliurament · ${p.due}:</strong> ${p.product}</p>${templateLink(p,i)}<p><a href="#fase-${i+1}" data-go="${i+1}">Consultar la fase ${i+1} →</a></p></article>`).join('')}</div><section class="section"><h2>Dates clau i fites</h2><div class="milestone-cards">${milestones.map(([d,label,n])=>`<a class="card" href="#fase-${n}" data-go="${n}"><div class="date">◆ ${dateLabel(d)} · 2026</div><strong>${label}</strong></a>`).join('')}</div></section>${gantt()}<div class="note section"><h3>Com seguim el projecte?</h3><p>La web orienta sobre les fases, el calendari i els lliuraments. Completeu la documentació a les plantilles i manteniu el Kanban de Trello amb responsables, terminis i evidències.</p></div><div class="actions"><span></span><button class="action" data-next="1">Començar · Fase 1 →</button></div></section>`;
function renderPhase(p,i){return `<section class="page" id="page${i+1}" style="--phase:${p.color}"><div class="eyebrow">FASE ${i+1} DE 3 · ${p.dates}</div><h1>${p.title}</h1><p class="lead">${p.goal}</p><div class="strip"><span class="tag">${p.dates}</span><span class="tag green">Lliurament · ${p.due}</span></div>${templateLink(p,i)}<section class="section"><h2>Què treballarem?</h2><ul class="tasks">${p.topics.map(t=>`<li>${t}</li>`).join('')}</ul></section><section class="section"><h2>Activitats i períodes</h2>${p.activities.map(([title,start,end])=>`<div class="day"><div class="dayhead">${shortDate(start)}${start!==end?' – '+shortDate(end):''}</div><div><h3>${title}</h3></div></div>`).join('')}</section><section class="deliver"><div class="eyebrow">Lliurament · ${p.due}</div><h2>Què heu de presentar?</h2><p>${p.product}</p><p class="small">${i===0?'Completeu la plantilla de definició i reviseu l’MVP amb el professorat.':i===1?'Mostreu el disseny, el tauler Kanban i el primer prototip.':'El 4 de desembre: MVP funcional. Després, proves, documentació i assaig fins a la Jornada del 18 de desembre.'}</p></section><p class="hint section">Planificació orientativa, ajustable al ritme de treball i a les hores lectives disponibles.</p><div class="actions"><button class="action secondary" data-prev="${i}">← ${i===0?'Portada':'Fase anterior'}</button><button class="action" data-next="${i<2?i+2:0}">${i<2?'Fase següent →':'Tornar a la portada'}</button></div></section>`;}
main.innerHTML=home+phases.map(renderPhase).join('');
function show(i){document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('active',i===j));document.querySelectorAll('nav button').forEach((b,j)=>{b.classList.toggle('active',i===j);if(i===j)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});document.getElementById('progressBar').style.width=`${(i+1)/4*100}%`;history.replaceState(null,'',i?'#fase-'+i:'#portada');window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const control=e.target.closest('[data-page],[data-go],[data-next],[data-prev]');if(!control)return;e.preventDefault();show(Number(control.dataset.page??control.dataset.go??control.dataset.next??control.dataset.prev));});
function pageFromHash(){const match=location.hash.match(/^(?:#fase-|#bloc-)(\d+)$/);return match?Math.max(1,Math.min(3,Number(match[1]))):0;}
window.addEventListener('hashchange',()=>show(pageFromHash()));show(pageFromHash());

    </script>
</body>

</html>
